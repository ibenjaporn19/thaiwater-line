name: thaiwater-line
on:
  # schedule:
  # - cron: "23 */2 * * *"   # every 2 hours, UTC
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      force_wl:
        description: "Test: always send /wl pages"
        type: boolean
        default: false
        
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_WL: ${{ inputs.force_wl && '1' || '0' }}
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Capture screenshots
        run: python run.py capture
      - name: Publish images branch
        run: |
          test -d shots || { echo "shots folder missing: capture did not run"; exit 1; }
          cd shots
          git init -b images
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "screenshots ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" images
      - name: Send to LINE
        run: python run.py send

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_TO\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ thaiwater workflow ล้มเหลว ดูที่ GitHub Actions\"}]}"
